name: parallel-epic-execution
description: "Execute an entire epic using parallel subagents. Analyzes story dependencies, dispatches Dev subagents in waves, coordinates merges, and owns sprint-status.yaml updates. Uses dual-model pattern: Sonnet for implementation, Opus for code review."
author: "BMad"

# Critical variables from config
config_source: "{project-root}/.bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
user_skill_level: "{config_source}:user_skill_level"
document_output_language: "{config_source}:document_output_language"
date: system-generated
sprint_artifacts: "{config_source}:sprint_artifacts"
sprint_status: "{sprint_artifacts}/sprint-status.yaml"

# Workflow components
installed_path: "{project-root}/.bmad/bmm/workflows/4-implementation/parallel-epic-execution"
instructions: "{installed_path}/instructions.xml"
validation: "{installed_path}/checklist.md"
template: false

variables:
  # Project context - critical for git workflow rules
  project_context: "**/project-context.md"
  story_dir: "{sprint_artifacts}"

  # Epic to execute (required input)
  epic_number: "" # Set by user, e.g., "1"

  # Subagent configuration
  implementation_model: "sonnet" # Model for dev-story execution
  review_model: "opus" # Model for code-review execution

  # Git workflow
  main_branch: "main"
  integration_branch: "dev"
  branch_prefix: "story/"

  # Parallelism settings
  max_parallel_stories: 3 # Maximum stories to run in parallel per wave

# Smart input file references
input_file_patterns:
  architecture:
    description: "System architecture for context"
    whole: "{output_folder}/*architecture*.md"
    sharded: "{output_folder}/*architecture*/*.md"
    load_strategy: "FULL_LOAD"
  epics:
    description: "Epic file containing stories to execute"
    whole: "{output_folder}/*epic*.md"
    sharded_index: "{output_folder}/*epic*/index.md"
    sharded_single: "{output_folder}/*epic*/epic-{epic_number}.md"
    load_strategy: "SELECTIVE_LOAD"
  dependency_analysis:
    description: "Implementation readiness report with dependency info"
    whole: "{output_folder}/*readiness*.md"
    load_strategy: "FULL_LOAD"

# Output configuration
default_output_file: "{sprint_artifacts}/parallel-execution-log-{epic_number}-{date}.md"

standalone: true
